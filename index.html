<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBTX Ecosystem | Strategic Infrastructure</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 2rem;
    }
    .landing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .brand-card {
      border: 2px solid var(--text-primary);
      padding: 3rem;
      text-decoration: none;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .brand-card:hover {
      background: var(--text-primary);
      color: var(--bg-color);
    }
    .brand-card h2 {
      border: none;
      padding: 0;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      word-break: break-all;
      overflow-wrap: break-word;
    }
    .brand-card .mono {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header style="max-width: 1200px; margin: 0 auto 4rem auto; width: 100%;">
    <div class="mono" style="font-weight: bold;">[ TBTX_ECOSYSTEM // PRODUCTION_READY ]</div>
  </header>

  <div class="landing-grid">
    <a href="transformby10x/index.html" class="brand-card">
      <div>
        <div class="mono">[ 01 ]</div>
        <h2>TransformBy10X</h2>
      </div>
      <div class="mono">PHILOSOPHY // DECLARATION</div>
    </a>

    <a href="bizbuilders/index.html" class="brand-card">
      <div>
        <div class="mono">[ 02 ]</div>
        <h2>BizBuilders AI</h2>
      </div>
      <div class="mono">INFRASTRUCTURE // SYSTEM REVEAL</div>
    </a>

    <a href="bizbotmarketing/index.html" class="brand-card">
      <div>
        <div class="mono">[ 03 ]</div>
        <h2>BizBot Marketing</h2>
      </div>
      <div class="mono">DIAGNOSTICS // LIVE SURFACE</div>
    </a>
  </div>

  <footer style="max-width: 1200px; margin: 4rem auto 0 auto; width: 100%;">
    <div class="mono" style="opacity: 0.5;">STRATEGIC INFRASTRUCTURE PRECEDES EXECUTION.</div>
  </footer>

</body>
</html>
